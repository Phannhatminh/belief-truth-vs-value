<style>

* { box-sizing: border-box; }
body {

main { max-width: 680px; margin: 0 auto; padding-block: 32px 64px; display: grid; gap: 24px; }

.q { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.scale button {
  font: 500 0.95rem "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums;
  padding: 10px 0; border-radius: 6px; border: 1px solid var(--line);

}

.scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scale-ends { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary {
  font: 600 1rem "IBM Plex Sans", system-ui, sans-serif; padding: 12px 20px; border-radius: 8px;
  border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; justify-self: start;
}
.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
input[type="text"] {

  border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; max-width: 320px;

textarea {

.vi { font-size: 0.9rem; color: var(--muted); }
.note { font-size: 0.85rem; color: var(--warn); }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
@media (max-width: 420px) { .scale button { padding: 12px 0; font-size: 0.9rem; } }

r come back. His trainer has told him that players who sit down convinced they will win play sharper, more ambitious moves, while players who have given up drift into passive draws.", "IR": "Arjun is playing the final three games of a chess championship match. He trails by two points, and players in his position almost never come back."}, "q": {"credence": "Does Arjun think it is likely that he will win the match?", "reasonable": "Is it reasonable for Arjun to hold this belief, given his situation?", "evidence": "If Arjun were given strong new evidence that it is unlikely that he will win the match, would he probably give up this belief?"}}, {"id": "lena", "target": "Lena believes that they will reach the summit.", "ctx": {"TS": "Lena is part of an expedition waiting to attempt the summit of a high peak. The forecast shows a long stretch of calm weather, and teams in these conditions usually summit.", "VD": "Lena is part of an expedition waiting to attempt the summit of a high peak. The forecast shows only a narrow, uncertain window, and teams in these conditions rarely summit. Her expedition leader has said that climbers who are convinced they will make it keep moving through the exhaustion of the last hours, and those are the only ones who have any chance at all.", "IR": "Lena is part of an expedition waiting to attempt the summit of a high peak. The forecast shows only a narrow, uncertain window, and teams in these conditions rarely summit."}, "q": {"credence": "Does Lena think it is likely that they will reach the summit?", "reasonable": "Is it reasonable for Lena to hold this belief, given her situation?", "evidence": "If Lena were given strong new evidence that it is unlikely that they will reach the summit, would she probably give up this belief?"}}, {"id": "marcus", "target": "Marcus believes that he will make the team.", "ctx": {"TS": "Marcus is trying out for a professional basketball team. Scouts have told him that he is among the top prospects and that nearly everyone at his level gets a contract.", "VD": "Marcus is trying out for a professional basketball team. Scouts have told him that only about one player in ten at his level gets a contract. His mentor told him that players who walk into tryouts convinced they belong there play loose and confident, and scouts notice that more than anything.", "IR": "Marcus is trying out for a professional basketball team. Scouts have told him that only about one player in ten at his level gets a contract."}, "q": {"credence": "Does Marcus think it is likely that he will make the team?", "reasonable": "Is it reasonable for Marcus to hold this belief, given his situation?", "evidence": "If Marcus were given strong new evidence that it is unlikely that he will make the team, would he probably give up this belief?"}}, {"id": "priya", "target": "Priya believes that the startup will succeed.", "ctx": {"TS": "Priya has put her savings into a startup that is about to launch its first product. Pre-orders are strong, and investors estimate that ventures with numbers like hers usually succeed.", "VD": "Priya has put her savings into a startup that is about to launch its first product. Investors estimate that ventures like hers succeed only about one time in ten. An experienced founder told her that the startups that survive are nearly always led by founders who are convinced they will succeed, because that conviction is what carries them through the hard months.", "IR": "Priya has put her savings into a startup that is about to launch its first product. Investors estimate that ventures like hers succeed only about one time in ten."}, "q": {"credence": "Does Priya think it is likely that the startup will succeed?", "reasonable": "Is it reasonable for Priya to hold this belief, given her situation?", "evidence": "If Priya were given strong new evidence that it is unlikely that the startup will succeed, would she probably give up this belief?"}}, {"id": "jonas", "target": "Jonas believes tha f, given her situation?", "evidence": "If Hana were given strong new evidence that it is unlikely that the investor will fund her company, would she probably give up this belief?"}}, {"id": "carlos", "target": "Carlos believes that he will close the deal.", "ctx": {"TS": "Carlos is trying to close the biggest sale of his career. The client has signaled strong interest, and deals at this stage close most of the time.", "VD": "Carlos is trying to close the biggest sale of his career. The client is talking to several larger competitors, and deals like this close only rarely. His manager has told him that salespeople who go into the final meeting convinced they will close are noticeably more persuasive.", "IR": "Carlos is trying to close the biggest sale of his career. The client is talking to several larger competitors, and deals like this close only rarely."}, "q": {"credence": "Does Carlos think it is likely that he will close the deal?", "reasonable": "Is it reasonable for Carlos to hold this belief, given his situation?", "evidence": "If Carlos were given strong new evidence that it is unlikely that he will close the deal, would he probably give up this belief?"}}, {"id": "eunji", "target": "Eun-ji believes that a publisher will accept her novel.", "ctx": {"TS": "Eun-ji has submitted her first novel to publishers. Her agent says the manuscript is exceptional and that books like it are almost always picked up.", "VD": "Eun-ji has submitted her first novel to publishers. Her agent says that only a few percent of first novels like hers are ever accepted. Her agent added that authors who are convinced their book will find a home keep submitting and revising, while those who lose that conviction give up after the first rejections.", "IR": "Eun-ji has submitted her first novel to publishers. Her agent says that only a few percent of first novels like hers are ever accepted."}, "q": {"credence": "Does Eun-ji think it is likely that a publisher will accept her novel?", "reasonable": "Is it reasonable for Eun-ji to hold this belief, given her situation?", "evidence": "If Eun-ji were given strong new evidence that it is unlikely that a publisher will accept her novel, would she probably give up this belief?"}}, {"id": "farid", "target": "Farid believes that the harvest will be good.", "ctx": {"TS": "Farid has planted his entire farm with a new crop this season. The seasonal forecast predicts ideal rain, and the crop has done well on neighboring farms.", "VD": "Farid has planted his entire farm with a new crop this season. The seasonal forecast predicts a severe drought, and the crop has failed on neighboring farms in dry years. His father taught him that farmers who are convinced the harvest will come keep irrigating and weeding through the dry weeks, and they are the only ones who ever get a harvest in a bad year.", "IR": "Farid has planted his entire farm with a new crop this season. The seasonal forecast predicts a severe drought, and the crop has failed on neighboring farms in dry years."}, "q": {"credence": "Does Farid think it is likely that the harvest will be good?", "reasonable": "Is it reasonable for Farid to hold this belief, given his situation?", "evidence": "If Farid were given strong new evidence that it is unlikely that the harvest will be good, would he probably give up this belief?"}}, {"id": "nadia", "target": "Nadia believes that she will pass the exam.", "ctx": {"TS": "Nadia is retaking the bar exam next month. Her practice scores are well above the passing line, and most people with her scores pass.", "VD": "Nadia is retaking the bar exam next month. Her practice scores are well below the passing line, and few people with her scores pass. Her tutor has told her that test-takers who walk in convinced they will pass stay calm and think clearly, while anxious ones lose many points to panic.", "IR": "Nadia is retaking the bar exam next month. Her practice scores are well below the passing line, and few people with her const CONDS = ["TS", "VD", "IR"];

const STORE_KEY = "belief-study-v1";

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

}
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

}

}

function renderIntro() {
  const name = el("input", { type: "text", id: "rater", placeholder: "Nickname or initials", autocomplete: "off" });
  const btn = el("button", { class: "primary", onclick: () => start(name.value.trim() || "anon") }, "Start");
  app.replaceChildren(
    el("div", { class: "stack" },
      el("span", { class: "eyebrow" }, "Reading study · about 15 minutes"),
      el("h1", {}, "How do people mean “believe”?"),
    ),
    el("div", { class: "panel" },
      el("p", {}, "You will read 26 short passages about people in difficult situations. Each passage ends with a sentence saying what the person believes. Answer three questions about each person on a scale from 1 (definitely no) to 7 (definitely yes)."),
      el("p", {}, "There are no right answers. Go with your first reading of the passage."),
      el("p", { class: "vi" }, "Bạn sẽ đọc 26 đoạn văn ngắn về những người đang ở hoàn cảnh khó khăn. Mỗi đoạn kết thúc bằng một câu nói người đó tin điều gì. Trả lời ba câu hỏi về người đó, thang từ 1 (chắc chắn không) đến 7 (chắc chắn có). Không có đáp án đúng; hãy theo cách hiểu đầu tiên của bạn."),
      el("p", { class: "muted" }, "Nothing is sent anywhere. At the end you copy your answers and send them to the person who shared this page."),
      el("div", { class: "stack" }, el("label", { for: "rater" }, "Your nickname (optional)"), name),
      btn,
    ),
  );
}

function scale(onPick) {
  const wrap = el("div", { class: "stack" });
  const row = el("div", { class: "scale", role: "group" });
  for (let v = 1; v <= 7; v++) {
    const b = el("button", { type: "button", "aria-pressed": "false", "aria-label": String(v) }, String(v));
    b.addEventListener("click", () => {
      row.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      onPick(v);
    });
    row.append(b);
  }
  wrap.append(row, el("div", { class: "scale-ends" }, el("span", {}, "1 · Definitely no"), el("span", {}, "Definitely yes · 7")));
  return wrap;
}

function renderTrial() {
  const t = state.order[state.pos];
  const total = state.order.length;
  const picks = {};
  const next = el("button", { class: "primary", disabled: "" }, state.pos + 1 === total ? "Finish" : "Next");
  const need = t.kind === "item" ? QKEYS.length : 1;
  const onPick = key => v => {
    picks[key] = v;
    if (Object.keys(picks).length === need) next.removeAttribute("disabled");
  };

  let body;
  if (t.kind === "item") {
    const it = DATA[t.idx];
    body = el("div", { class: "panel" },
      el("p", { class: "passage" }, it.ctx[t.cond] + " ", el("span", { class: "target" }, it.target)),
      ...QKEYS.map(k => el("div", { class: "q" }, el("h2", {}, it.q[k]), scale(onPick(k)))),
    );
    next.addEventListener("click", () => {
      for (const k of QKEYS) state.answers.push({ item: it.id, cond: t.cond, q: k, score: picks[k] });
      advance();
    });
  } else {
    const c = CHECKS[t.idx];
    body = el("div", { class: "panel" },
      el("p", { class: "passage" }, c.passage),
      el("div", { class: "q" }, el("h2", {}, c.q), scale(onPick("check"))),
    );
    next.addEventListener("click", () => {
      state.checks.push({ id: c.id, expect: c.expect, score: picks.check });
      advance();
    });
  }

  const bar = el("div", { class: "progress" }, el("div"));
  bar.firstChild.style.width = `${(state.pos / total) * 100}%`;
  app.replaceChildren(
    el("div", { class: "row" }, el("span", { class: "eyebrow" }, `Passage ${state.pos + 1} of ${total}`), el("span", { class: "muted" }, `List ${state.list}`)),
    bar, body, next,
  );
  window.scrollTo({ top: 0 });
}

function advance() {
  state.pos += 1;
  if (state.pos >= state.order.length) state.finished = new Date().toISOString();
  save();
  render();
}

function renderDone() {
  const out = { v: state.v, rater: state.rater, list: state.list, started: state.started, finished: state.finished, answers: state.answers, checks: state.checks };
  const text = JSON.stringify(out);
  const area = el("textarea", { readonly: "", id: "results" });
  area.value = text;
  const msg = el("span", { class: "muted" });
  const copy = el("button", { class: "primary" }, "Copy results");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); msg.textContent = "Copied. Paste it into a message to the person who shared this page."; }
    catch (e) { area.focus(); area.select(); msg.textContent = "Copying is blocked here. The text is selected; copy it with your keyboard."; }
  });
  const restart = el("button", { type: "button", class: "primary", style: "background: transparent; color: var(--muted); border: 1px solid var(--line);" }, "Start over as a new rater");
  restart.addEventListener("click", () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = null; render();
  });
  app.replaceChildren(
    el("div", { class: "stack" }, el("span", { class: "eyebrow" }, "Done"), el("h1", {}, "Thank you")),
    el("div", { class: "panel" },
      el("p", {}, "Copy your answers below and send them to the person who shared this page. Nothing has been sent automatically."),
      el("p", { class: "vi" }, "Bấm Copy results rồi gửi đoạn văn bản cho người đã chia sẻ trang này. Chưa có gì được gửi tự động."),
      copy, msg, area,
    ),
    restart,
  );
}

function render() {
  if (!state) return renderIntro();
  if (state.pos >= state.order.length) return renderDone();
  renderTrial();
}

render();
</script>
